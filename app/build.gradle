plugins {
    id 'com.android.application'
}


dependencies {
    implementation("androidx.core:core:1.3.1")
    implementation("androidx.drawerlayout:drawerlayout:1.0.0")
    implementation 'net.i2p.crypto:eddsa:0.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

android {
    compileSdkVersion 30
    testOptions { unitTests.includeAndroidResources = true }
    // This is direct distribution, not a Play Store submission. Preserve the
    // already-tested window/inset behavior; check every other release lint rule.
    lint { disable 'ExpiredTargetSdkVersion' }

    buildTypes {
        debug {
            applicationIdSuffix ".qa"
            versionNameSuffix "-QA"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    defaultConfig {
        applicationId "org.olgsoft.apipepanic.haoke"
        versionCode 33
        versionName "0.21-haoke.33"
        // The shipped 3D renderer requires a modern WebView with WebGL 2.
        minSdkVersion 26
        targetSdkVersion 30
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'org.olgsoft.apipepanic'
}
